name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run maintenance regression tests
        run: python -m unittest discover -s tests -p test_maintenance.py -v
      - name: Validate static files
        run: python scripts/validate_skill.py
